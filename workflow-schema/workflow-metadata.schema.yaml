"$schema": "https://json-schema.org/draft/2020-12/schema"
title: "Varda workflow SKILL.md frontmatter"
description: "The Agent Skills frontmatter format with Varda workflow metadata."
type: object
additionalProperties: false
required:
  - name
  - description
  - license
  - metadata
properties:
  name:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  description:
    type: string
    minLength: 1
    maxLength: 1024
  license:
    type: string
    minLength: 1
  compatibility:
    type: string
    minLength: 1
    maxLength: 500
  metadata:
    type: object
    required:
      - version
      - author
      - language
      - varda-display-name
      - varda-type
      - varda-availability
      - practice
      - jurisdictions
    properties:
      version:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
      author:
        description: "Name of the workflow author or publishing organisation."
        type: string
        minLength: 1
      language:
        type: string
        minLength: 1
      varda-display-name:
        type: string
        minLength: 1
      varda-type:
        enum:
          - assistant
          - tabular
      varda-availability:
        description: Whether the workflow ships with Varda or is installed as an add-on.
        enum:
          - system
          - add-on
      practice:
        type: string
        minLength: 1
      jurisdictions:
        description: A comma-separated list of applicable jurisdictions.
        type: string
        minLength: 1
    additionalProperties:
      type: string
  allowed-tools:
    type: string
    minLength: 1
